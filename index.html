<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17603f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#122119" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/source-sans-3-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<meta name="description" content="Offline marks, totals, positions and grades for PNG primary schools (SAPS). Links to Excel.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>SAPS Grade Book</title>
<style>
@font-face{font-family:"Lexend";src:url("fonts/lexend-latin-wght.woff2") format("woff2-variations");font-weight:300 700;font-display:swap}
@font-face{font-family:"Source Sans 3";src:url("fonts/source-sans-3-latin-wght.woff2") format("woff2-variations");font-weight:300 700;font-display:swap}
/* ---------- design tokens: Minimalism & Swiss (UI/UX Pro Max) ---------- */
:root{
  color-scheme:light;
  --font-head:"Lexend",system-ui,sans-serif;--font-body:"Source Sans 3",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#f4f6f5;--surface:#ffffff;--surface-2:#eef2f0;--ink:#10231a;--ink-2:#3f5148;--muted:#56665d;
  --line:#d3dcd7;--line-strong:#a9b8b0;
  --pri:#17603f;--on-pri:#ffffff;--pri-hover:#124d32;--pri-soft:#e1f0e7;--pri-ink:#0f4a30;
  --header:#17603f;--on-header:#ffffff;--header-ctl:rgba(255,255,255,.14);--header-line:rgba(255,255,255,.45);
  --warn-bg:#fff2dc;--warn-ink:#713f00;--bad:#b42318;--bad-bg:#fdecea;--bad-ink:#8f1d14;--ok-bg:#e1f0e7;--ok-ink:#0f4a30;
  --info-bg:#e7effc;--info-ink:#1d3f8a;--hi-row:#fff7dc;
  --ring:#0b63ce;
  --gA-bg:#cfeedb;--gA:#0d4f2f;--gB-bg:#e2f2d1;--gB:#2f5216;--gC-bg:#fbefbf;--gC:#5f4200;--gD-bg:#ffe0c9;--gD:#843508;--gE-bg:#fddcd9;--gE:#901a12;
  --barA:#1f7a4d;--barB:#5e9e45;--barC:#c9971a;--barD:#d9722a;--barE:#c0392b;
  --lower:#1d4f91;--lower-bg:#e5eefb;--upper:#6b2f91;--upper-bg:#f2e8f8;
  --shadow:0 1px 2px rgba(16,35,26,.06),0 1px 1px rgba(16,35,26,.04);
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --dur:160ms;--ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0e1411;--surface:#151d19;--surface-2:#1c2621;--ink:#e6eee9;--ink-2:#bfccc5;--muted:#a3b3aa;
  --line:#2b3731;--line-strong:#46564e;
  --pri:#4cc38a;--on-pri:#04140b;--pri-hover:#6fd3a2;--pri-soft:#173527;--pri-ink:#a4e6c4;
  --header:#122119;--on-header:#e6eee9;--header-ctl:rgba(255,255,255,.08);--header-line:rgba(255,255,255,.28);
  --warn-bg:#3a2a0c;--warn-ink:#f6cd84;--bad:#ff8f84;--bad-bg:#3d1715;--bad-ink:#ffb4ad;--ok-bg:#173527;--ok-ink:#a4e6c4;
  --info-bg:#172440;--info-ink:#b3cbff;--hi-row:#2b2812;
  --ring:#7ab4ff;
  --gA-bg:#1b4a33;--gA:#b4f2d0;--gB-bg:#2b4220;--gB:#cdebaf;--gC-bg:#4a3a0c;--gC:#f8de86;--gD-bg:#4d2a12;--gD:#ffc9a6;--gE-bg:#4f1c1a;--gE:#ffbcb5;
  --barA:#3fae76;--barB:#82c066;--barC:#e0b33d;--barD:#ee9156;--barE:#ec6d5f;
  --lower:#9cc0ff;--lower-bg:#16264a;--upper:#dcb3ff;--upper-bg:#2d1b40;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button,a,select,label[for],.chip,.btn{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}
h1,h2,h3{font-family:var(--font-head);font-weight:600;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
h1.pt{margin:0 0 4px;font-size:22px}
h3{margin:0 0 12px;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:14px}
.ico{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top));background:var(--header);color:var(--on-header)}
header .logo{display:flex;align-items:center;gap:10px;min-width:0}
header .mark{width:34px;height:34px;border-radius:9px;background:var(--on-header);color:var(--header);display:grid;place-items:center;flex:0 0 34px}
header .mark .ico{width:20px;height:20px}
header .ttl{font-family:var(--font-head);font-weight:600;font-size:17px;line-height:1.2}
header .ttl small{display:block;font-family:var(--font-body);font-weight:400;font-size:13px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
header .sel{margin-left:auto;display:flex;gap:8px;align-items:center}
header select{min-height:44px;background:var(--header-ctl);border:1px solid var(--header-line);color:var(--on-header);border-radius:var(--r-sm);padding:8px 10px;max-width:260px}
header select option{color:#10231a;background:#fff}
#status{font-size:13px;opacity:.9;min-width:96px;text-align:right}
#status.err{font-weight:700;text-decoration:underline}
nav{background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;gap:12px;align-items:center;width:100%;min-height:48px;text-align:left;border:0;background:none;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:600;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button:active{background:var(--pri-soft)}
nav button[aria-current="page"]{background:var(--pri-soft);color:var(--pri-ink)}
nav .foot{font-size:14px;color:var(--muted);padding:16px 12px;margin-top:auto}
nav .foot a{color:var(--pri-ink);font-weight:600;display:inline-flex;align-items:center;min-height:44px}
main{overflow:auto;padding:24px 28px 64px;scroll-padding-top:16px}
.wrap{max-width:1180px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start;margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:32px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r-md);background:var(--surface)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 16px;font-weight:600;white-space:nowrap;text-decoration:none;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn:hover{background:var(--surface-2)}
.btn:active{background:var(--pri-soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn.icon{padding:8px;min-width:44px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
label.f{display:block;margin-bottom:12px;font-size:15px;font-weight:600;color:var(--ink-2)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;min-height:48px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:16px;font-weight:400}
label.f textarea{min-height:96px}
label.f input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ferr{color:var(--bad-ink);font-size:14px;font-weight:600;margin:-6px 0 12px}
.help{font-size:14px;color:var(--muted);font-weight:400;margin-top:4px}
.inp{min-height:48px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:16px}
label.row{min-height:44px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:.3em;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;transition:background-color var(--dur) var(--ease)}
.chip:hover{background:var(--surface-2)}
.chip.on,.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.chip.add{border-style:dashed;color:var(--ink-2);font-weight:500}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow-x:auto}
.seg button{flex:1 0 auto;min-height:44px;border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--pri-ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--pri)}
.meter.over i{background:var(--bad)}

/* ---------- status & badges ---------- */
.note{padding:12px 14px;border-radius:var(--r-sm);font-size:15px;margin:12px 0;border:1px solid transparent}
.note a{color:inherit;font-weight:700}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.ok{background:var(--ok-bg);color:var(--ok-ink)}
.note.bad{background:var(--bad-bg);color:var(--bad-ink)}
.trialbar{background:var(--info-bg);color:var(--info-ink);margin:0 0 12px}
.backupBar{display:none;margin:0 0 12px}
.badge{font-size:13px;padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.badge.lower{background:var(--lower-bg);color:var(--lower)}
.badge.upper{background:var(--upper-bg);color:var(--upper)}
.g{display:inline-block;min-width:28px;padding:2px 8px;border-radius:6px;font-weight:700;font-size:14px;text-align:center;line-height:1.4}
.gA{background:var(--gA-bg);color:var(--gA)}.gB{background:var(--gB-bg);color:var(--gB)}.gC{background:var(--gC-bg);color:var(--gC)}.gD{background:var(--gD-bg);color:var(--gD)}.gE{background:var(--gE-bg);color:var(--gE)}
.bars i.gA{background:var(--barA)}.bars i.gB{background:var(--barB)}.bars i.gC{background:var(--barC)}.bars i.gD{background:var(--barD)}.bars i.gE{background:var(--barE)}

/* ---------- classes ---------- */
.cls .cls-h{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.cls .big{width:48px;height:48px;border-radius:var(--r-md);background:var(--pri-soft);color:var(--pri-ink);display:grid;place-items:center;font-family:var(--font-head);font-weight:600;font-size:17px}
.cls.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.cls .badge{margin-left:auto}
.cls .row{margin-top:12px}

/* ---------- tables ---------- */
table.t{border-collapse:separate;border-spacing:0;background:var(--surface);width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
table.t th{background:var(--surface-2);font-size:14px;font-weight:700;color:var(--ink-2);position:sticky;top:0;z-index:1;vertical-align:bottom}
table.t th .tt{font-size:13px;font-weight:400;color:var(--muted);display:block}
table.t td.c,table.t th.c{text-align:center}
table.t td.num{text-align:right}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t input.cell,table.t select{width:100%;min-height:44px;border:1px solid transparent;padding:6px 8px;border-radius:6px;background:transparent}
table.t input.cell:hover,table.t select:hover{border-color:var(--line)}
table.t input.cell:focus{border-color:var(--pri);background:var(--surface)}
.gridwrap{overflow:auto;max-height:calc(100dvh - 260px);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.gridwrap table.t{border:0}
.tablebox{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
table.marks td{padding:0}
table.marks td.nm{padding:8px 10px;white-space:nowrap;min-width:190px;position:sticky;left:0;background:var(--surface);z-index:1}
table.marks th.nm{position:sticky;left:0;z-index:2}
table.marks td.ro{padding:8px 10px;text-align:center;background:var(--surface-2);min-width:60px}
table.marks input.sc{width:64px;min-height:44px;border:0;padding:6px;text-align:center;background:transparent;font-variant-numeric:tabular-nums}
table.marks input.sc:focus{outline:3px solid var(--ring);outline-offset:-3px;background:var(--surface)}
table.marks input.sc.bad,.mrow input.sc.bad{background:var(--bad-bg);color:var(--bad-ink);font-weight:700}
.pos1 td{background:var(--hi-row)!important}

/* ---------- results ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat b{display:block;font-family:var(--font-head);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.bars{display:flex;gap:10px;align-items:flex-end;height:110px;padding:6px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:14px;font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:3px}

/* ---------- task-by-task entry list ---------- */
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.mrow{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 72px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .no{color:var(--muted);font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.mrow .nm2{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.mrow .nm2 small{display:block;color:var(--muted);font-size:13px}
.mrow input.sc{width:100%;height:48px;border:1px solid var(--line-strong);border-radius:var(--r-sm);text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface)}
.mrow input.sc:focus{border-color:var(--ring)}
.mrow .rk{text-align:right;font-size:13px;line-height:1.4;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .rk b{color:var(--ink);font-size:15px}
.mrow .rowerr{grid-column:2/-1;color:var(--bad-ink);font-size:14px;font-weight:600;margin-top:-2px}

/* ---------- licence ---------- */
.devid{font:700 26px/1.2 ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;padding:16px;border:2px dashed var(--pri);border-radius:var(--r-md);background:var(--pri-soft);color:var(--pri-ink);margin:8px 0 4px;user-select:all;overflow-wrap:anywhere}
.lic{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:16px}.lic span{color:var(--muted)}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-sm);font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:tin 200ms var(--ease)}
.toast.bad{background:var(--bad-ink);color:#fff}
@media (prefers-color-scheme:dark){.toast.bad{background:#5c1712;color:#ffe3e0}}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.hide{display:none!important}
.sh,.mo{display:none}
#printArea{display:none}

/* ---------- phone ---------- */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  main,header{min-width:0}
  header{grid-column:1;flex-wrap:wrap;gap:8px 10px;padding:8px 12px 10px;padding-top:max(8px,env(safe-area-inset-top))}
  header .mark{width:30px;height:30px;flex-basis:30px}
  header .ttl{font-size:16px}
  header .ttl small{max-width:70vw}
  header .sel{margin-left:0;width:100%}
  header .sel select{flex:1;min-width:0;max-width:none;padding:8px}
  #status{min-width:0;font-size:12px;position:absolute;right:12px;top:max(12px,env(safe-area-inset-top))}
  header{position:relative}
  nav{grid-row:3;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);gap:4px;overflow:visible}
  nav button{flex:1 1 0;flex-direction:column;gap:2px;min-height:56px;padding:6px 2px;font-size:12.5px;text-align:center;justify-content:center;line-height:1.15;min-width:0}
  nav button .ico{width:22px;height:22px}
  nav .foot{display:none}
  main{padding:16px 16px 32px}
  h1.pt{font-size:20px}
  .lg,.pc{display:none!important}.sh{display:inline}.mo{display:inline}
  .grid2,.grid2[style]{grid-template-columns:minmax(0,1fr)!important}
  .toolbar .btn{flex:1 1 auto}
  .gridwrap{max-height:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  table.t th,table.t td{padding:8px 8px}
  .cls .badge{margin-left:0}
  .backupBar{display:block!important}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
  table.tasks thead{display:none}
  table.tasks,table.tasks tbody{display:block;border:0;background:none}
  table.tasks tr{display:grid;grid-template-columns:32px minmax(0,1fr) 92px;grid-template-areas:"no nm del" "no ty mx" "no dt dt";gap:8px;padding:12px 10px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:10px;background:var(--surface)}
  table.tasks tr:hover td{background:none}
  table.tasks td{border:0;padding:0}
  table.tasks td:nth-child(1){grid-area:no;align-self:center;font-weight:700;color:var(--pri-ink);font-family:var(--font-head)}
  table.tasks td:nth-child(2){grid-area:nm}table.tasks td:nth-child(3){grid-area:ty}table.tasks td:nth-child(4){grid-area:dt}table.tasks td:nth-child(5){grid-area:mx}table.tasks td:nth-child(6){grid-area:del;text-align:right}
  table.tasks input.cell,table.tasks select{border:1px solid var(--line-strong);background:var(--surface)}
  table.tasks td:nth-child(5)::before{content:"Out of";display:block;font-size:13px;color:var(--muted)}
}
@media (max-width:820px) and (orientation:landscape) and (max-height:500px){
  header{padding-top:6px;padding-bottom:6px}
  header .ttl small{display:none}
  nav button{min-height:48px;flex-direction:row;gap:6px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important;scroll-behavior:auto!important}}

/* ---------- print (always light) ---------- */
@media print{
  @page{size:A4 portrait;margin:9mm}
  body{background:#fff;color:#000}
  .app,#toasts{display:none}
  #printArea{display:block;font-family:Arial,sans-serif;color:#000}
}
.ps{page-break-after:always}
.ps:last-child{page-break-after:auto}
@page land{size:A4 landscape;margin:8mm}
.ps.land{page:land}

<script>
"use strict";
const KEY='sapsgb_v1';
const DEF_BANDS=[{g:'A',min:85,label:'Excellent'},{g:'B',min:70,label:'Very Good'},{g:'C',min:55,label:'Good'},{g:'D',min:40,label:'Satisfactory'},{g:'E',min:0,label:'Needs Improvement'}];
const TYPES=['Test','Assignment','Project','Practical','Oral','Exam','Other'];
const QUICK_SUBJECTS=['English','Mathematics','Science','Social Science','Arts','Health & Physical Education','Making a Living','Personal Development','Citizenship & Christian Values'];
let S=null;
let ui={tab:'classes',classId:null,subjectId:null,editClass:null,ap:1,rview:'total',sumDetail:false};

/* ---------- helpers ---------- */
const $=q=>document.querySelector(q);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const r1=x=>Math.round(x*10)/10;
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z]/g,'');
function level(grade){return Number(grade)<=5?{key:'lower',name:'Lower Primary',max:100}:{key:'upper',name:'Upper Primary',max:200}}
function cls(){return S.classes.find(c=>c.id===ui.classId)||null}
function subj(){const c=cls();return c?c.subjects.find(s=>s.id===ui.subjectId)||null:null}
function bands(){return S.bands.slice().sort((a,b)=>b.min-a.min)}
function gradeOf(p){if(p==null)return '';for(const b of bands()){if(p>=b.min)return b.g}return bands().slice(-1)[0].g}
function gChip(g){return g?`<span class="g g${esc(g)}">${esc(g)}</span>`:''}
function className(c){return c?`${c.grade}${c.section}`:''}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function safeSheet(n){return String(n).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31)||'Sheet'}

/* ---------- storage ---------- */
function defState(){return {v:1,school:{name:'',address:'',phone:''},bands:JSON.parse(JSON.stringify(DEF_BANDS)),classes:[],lastBackup:null,ui:{}}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){S=null}
  if(!S||!Array.isArray(S.classes))S=defState();
  if(!Array.isArray(S.bands)||!S.bands.length)S.bands=JSON.parse(JSON.stringify(DEF_BANDS));
  migrate();
  if(S.ui){ui.tab=S.ui.tab||'classes';ui.classId=S.ui.classId||null;ui.subjectId=S.ui.subjectId||null;ui.ap=S.ui.ap===2?2:1}
  if(!cls()){ui.classId=S.classes[0]?S.classes[0].id:null}
  fixSubject();
}
// v1 data had one assessment period per class; tag those tasks with the class's period.
function migrate(){S.classes.forEach(c=>c.subjects.forEach(s=>s.tasks.forEach(t=>{if(t.ap==null)t.ap=parseInt(c.period,10)===2?2:1})));S.v=2}
function save(){
  S.ui={tab:ui.tab,classId:ui.classId,subjectId:ui.subjectId,ap:ui.ap};
  try{localStorage.setItem(KEY,JSON.stringify(S));setStatus('Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}
  catch(e){setStatus('NOT SAVED – make a backup','err')}
}
const ERR_RE=/^(Could not|No |That |Enter |All other|Each grade|Set up|None of|This backup)/;
function toast(msg,kind){
  kind=kind||(ERR_RE.test(String(msg))?'bad':'info');
  const box=$('#toasts');if(!box)return;const t=document.createElement('div');t.className='toast '+kind;
  if(kind==='bad')t.setAttribute('role','alert');
  t.textContent=String(msg).replace(/\n\n+/g,' — ').replace(/\n/g,' ');box.appendChild(t);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>t.remove(),kind==='bad'?7000:4000);
}
function fieldErr(id,msg){const el=document.getElementById(id);if(!el)return toast(msg,'bad');el.setAttribute('aria-invalid','true');
  let e=document.getElementById(id+'_err');if(!e){e=document.createElement('div');e.id=id+'_err';e.className='ferr';e.setAttribute('role','alert');el.closest('label').after(e)}
  el.setAttribute('aria-describedby',e.id);e.textContent=msg;el.focus();el.addEventListener('input',()=>{el.removeAttribute('aria-invalid');e.remove()},{once:true})}
function setStatus(t,k){const s=$('#status');s.textContent=t;s.className=k||''}
function fixSubject(){const c=cls();if(!c){ui.subjectId=null;return}if(!c.subjects.find(s=>s.id===ui.subjectId))ui.subjectId=c.subjects[0]?c.subjects[0].id:null}

/* ---------- licence (one device) ---------- */
// Public key of Ready Digital Consultancy's signing key. Leave '' to switch licensing off.
const LICENSE_PUBKEY='8fLZhz_yOIxW251iWCSWq6-TrpZ0NYnOffMOrv9qeMo';
const LIC_KEY='sapsgb_licence',DEV_KEY='sapsgb_device';
const TRIAL={classes:1,subjects:2};
const RDC_WHATSAPP='67570254566';
let LIC={on:!!LICENSE_PUBKEY,ok:false,name:'',device:''};
function b64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function deviceId(){
  let d='';try{d=localStorage.getItem(DEV_KEY)||''}catch(e){}
  if(!/^GB-[0-9A-Z]{4}-[0-9A-Z]{4}$/.test(d)){
    const A='0123456789ABCDEFGHJKMNPQRSTVWXYZ',r=crypto.getRandomValues(new Uint8Array(8));
    const x=[...r].map(v=>A[v%32]).join('');d=`GB-${x.slice(0,4)}-${x.slice(4)}`;
    try{localStorage.setItem(DEV_KEY,d)}catch(e){}
  }
  return d;
}
// Code = GB1.<name>.<signature>; the signature covers "SAPSGB1|<device id>|<name>".
function checkCode(code,dev){
  code=String(code||'').replace(/\s+/g,'');
  const m=code.match(/^GB1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]{86})$/);if(!m)return {ok:false,why:'format'};
  try{const name=new TextDecoder().decode(b64u(m[1]));const sig=b64u(m[2]);
    const msg=new TextEncoder().encode(`SAPSGB1|${dev}|${name}`);
    return nacl.sign.detached.verify(msg,sig,b64u(LICENSE_PUBKEY))?{ok:true,name,code}:{ok:false,why:'device'};
  }catch(e){return {ok:false,why:'format'}}
}
function loadLicence(){
  LIC.device=deviceId();if(!LIC.on){LIC.ok=true;return}
  let code='';try{code=localStorage.getItem(LIC_KEY)||''}catch(e){}
  const r=code?checkCode(code,LIC.device):{ok:false};LIC.ok=r.ok;LIC.name=r.ok?r.name:'';
}
const trial=()=>LIC.on&&!LIC.ok;
function needLicence(what){if(!trial())return false;if(confirm(`${what} is only available in the full version.\n\nActivate SAPS Grade Book on this phone now?`))go('activate');return true}
function vActivate(){
  const dev=LIC.device;
  const msg=`Hi Ready Digital Consultancy, I would like to activate SAPS Grade Book.\nDevice ID: ${dev}\nTeacher name: \nSchool: `;
  if(LIC.ok)return `<h1 class="pt">Activation</h1><div class="card"><div class="note ok" style="margin-top:0">✔ Activated on this phone.</div>
    <div class="lic"><span>Licensed to</span><b>${esc(LIC.name)}</b><span>Device ID</span><b>${esc(dev)}</b></div>
    <div class="muted small">This licence works on this phone only. If you change phones or clear the app's data, send your new Device ID to Ready Digital Consultancy for a new code. Keep a backup of your marks so you can restore them after re-activating.</div></div>`;
  return `<h1 class="pt">Activate SAPS Grade Book</h1><div class="muted">The trial lets you set up ${TRIAL.classes} class with up to ${TRIAL.subjects} subjects. The full version adds unlimited classes and subjects, Excel export and import, and clean printouts.</div>
  <div class="card" style="margin-top:14px"><h3>Step 1 — Send your Device ID</h3>
    <div class="devid" id="devid">${esc(dev)}</div>
    <div class="toolbar"><a class="btn pri" href="https://wa.me/${RDC_WHATSAPP}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Send on WhatsApp</a><button class="btn" onclick="copyText('${dev}')">Copy Device ID</button></div>
    <div class="muted small">Or call / text Ready Digital Consultancy on 70254566 · tulezready@gmail.com. Each code works on one phone only.</div></div>
  <div class="card"><h3>Step 2 — Paste your activation code</h3>
    <label class="f">Activation code<textarea id="actcode" rows="3" placeholder="GB1.…" autocapitalize="off" autocorrect="off" spellcheck="false" style="font-family:monospace;font-size:13px"></textarea></label>
    <div id="actmsg"></div>
    <div class="toolbar"><button class="btn" onclick="pasteCode()">Paste</button><button class="btn pri" onclick="activate()">Activate</button></div></div>`;
}
async function copyText(t){try{await navigator.clipboard.writeText(t);setStatus('Copied')}catch(e){prompt('Copy this:',t)}}
async function pasteCode(){try{$('#actcode').value=await navigator.clipboard.readText()}catch(e){$('#actcode').focus()}}
function activate(){
  const code=$('#actcode').value,r=checkCode(code,LIC.device),m=$('#actmsg');
  if(!r.ok){m.innerHTML=`<div class="note bad">${r.why==='format'?'That does not look like a full activation code. Copy the whole code from the message, starting with GB1.':'This code is not for this phone. Check that you sent Device ID <b>'+esc(LIC.device)+'</b>.'}</div>`;return}
  try{localStorage.setItem(LIC_KEY,r.code)}catch(e){m.innerHTML='<div class="note bad">Could not save the code on this phone. Free up storage and try again.</div>';return}
  LIC.ok=true;LIC.name=r.name;render();toast(`Activated. Licensed to ${r.name}.`);
}

/* ---------- calculations ---------- */
const APS=[1,2];
function apOf(t){return Number(t.ap)===2?2:1}
function tasksOf(s,ap){return s.tasks.filter(t=>apOf(t)===ap)}
function rankBy(res,key){const v=Object.values(res).filter(r=>r[key]!=null).map(r=>r[key]);for(const id in res){const r=res[id];if(r[key]!=null)r.pos=1+v.filter(x=>x>r[key]).length}}
// One assessment period of one subject: out of 100 (Lower) or 200 (Upper).
function calc(c,s,ap){
  ap=ap||ui.ap||1;const L=level(c.grade),T=tasksOf(s,ap),res={};
  c.students.forEach(st=>{const sc=s.scores[st.id]||{};let tot=0,n=0;
    T.forEach(t=>{const v=sc[t.id];if(typeof v==='number'){tot+=v;n++}});
    res[st.id]=n?{tot:r1(tot),n,pct:r1(tot/L.max*100),complete:n===T.length}:{tot:null,n:0,pct:null,complete:false}});
  rankBy(res,'tot');for(const id in res){const r=res[id];if(r.tot!=null)r.grade=gradeOf(r.pct)}
  return res;
}
// Subject total = AP1 + AP2. The % is worked out of the periods that already have marks in this class,
// so grades stay fair before AP2 has been entered.
function calcTotal(c,s){
  const L=level(c.grade),per=APS.map(ap=>calc(c,s,ap));
  const active=APS.filter((ap,i)=>c.students.some(st=>per[i][st.id].tot!=null));
  const den=L.max*Math.max(1,active.length),res={};
  c.students.forEach(st=>{const a=per.map(p=>p[st.id]);const have=a.filter(x=>x.tot!=null);
    const tot=have.length?r1(have.reduce((x,y)=>x+y.tot,0)):null;
    res[st.id]={aps:a.map(x=>x.tot),tot,pct:tot==null?null:r1(tot/den*100),complete:active.every(ap=>a[ap-1].complete)}});
  rankBy(res,'tot');for(const id in res){const r=res[id];if(r.tot!=null)r.grade=gradeOf(r.pct)}
  return {res,den,active,max:L.max*APS.length};
}
// Final results: grand total of every subject's total; placing by grand total.
function calcSummary(c){
  const per=c.subjects.map(s=>calcTotal(c,s));
  const grandMax=per.filter(p=>p.active.length).reduce((a,p)=>a+p.den,0),res={};
  c.students.forEach(st=>{const subs=per.map(p=>p.res[st.id]);const have=subs.filter(x=>x.tot!=null);
    const tot=have.length?r1(have.reduce((a,x)=>a+x.tot,0)):null;
    const missing=per.filter((p,i)=>p.active.length&&(subs[i].tot==null||!subs[i].complete)).length;
    res[st.id]={subs,tot,pct:tot==null||!grandMax?null:r1(tot/grandMax*100),missing}});
  rankBy(res,'tot');for(const id in res){const r=res[id];if(r.tot!=null)r.grade=gradeOf(r.pct)}
  return {res,per,grandMax};
}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function byPos(a,b){return (a.pos||1e9)-(b.pos||1e9)||a.st.name.localeCompare(b.st.name)}

/* ---------- navigation ---------- */
function go(t){ui.tab=t;save();render()}
function pickClass(id){ui.classId=id;fixSubject();save();render()}
function pickSubject(id){ui.subjectId=id;save();render()}
function renderTop(){
  $('#schoolName').textContent=S.school.name||'Primary school marks, totals & positions';
  const tc=$('#topClass');
  tc.innerHTML=S.classes.length?S.classes.map(c=>`<option value="${c.id}" ${c.id===ui.classId?'selected':''}>Grade ${esc(className(c))} · T${esc(c.term)} · ${esc(c.year)}</option>`).join(''):'<option>No class yet</option>';
  const c=cls(),ts=$('#topSubj');
  const showS=c&&c.subjects.length&&['marks','results','subjects'].includes(ui.tab);
  ts.classList.toggle('hide',!showS);
  if(showS)ts.innerHTML=c.subjects.map(s=>`<option value="${s.id}" ${s.id===ui.subjectId?'selected':''}>${esc(s.name)}</option>`).join('');
  const grp=['classes','students','subjects'].includes(ui.tab)?'class':ui.tab==='activate'?'settings':ui.tab;
  document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.tab===grp)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const days=S.lastBackup?Math.floor((Date.now()-new Date(S.lastBackup).getTime())/864e5):null;
  $('#backupNote').innerHTML=S.classes.length?(days==null?'⚠ No backup made yet.':days>=7?`⚠ Last backup ${days} days ago.`:`Last backup: ${days===0?'today':days+' day(s) ago'}.`)+'<br><a href="#" onclick="go(\'settings\');return false">Back up now</a>':'';
}
function render(){
  renderTop();
  const v={classes:vClasses,students:vStudents,subjects:vSubjects,marks:vMarks,results:vResults,summary:vSummary,settings:vSettings,activate:vActivate}[ui.tab]||vClasses;
  const days=S.lastBackup?Math.floor((Date.now()-new Date(S.lastBackup).getTime())/864e5):null;
  const bb=S.classes.length&&ui.tab!=='settings'&&(days==null||days>=7)?`<div class="note warn backupBar">${days==null?'No backup made yet.':'Last backup '+days+' days ago.'} If this phone is lost or the app is cleared, marks are lost. <a href="#" onclick="backup();return false">Back up now</a></div>`:'';
  const tb=trial()&&ui.tab!=='activate'?`<div class="note trialbar">Trial version · ${TRIAL.classes} class, ${TRIAL.subjects} subjects, no Excel. <a href="#" onclick="go('activate');return false">Activate full version</a></div>`:'';
  const seg=['classes','students','subjects'].includes(ui.tab)?`<div class="seg" role="tablist" aria-label="Class setup">${[['classes','Classes'],['students','Students'],['subjects','Subjects &amp; tasks']].map(([k,l])=>`<button role="tab" aria-selected="${ui.tab===k}" onclick="go('${k}')">${l}</button>`).join('')}</div>`:'';
  const m=$('#main');if(m.dataset.tab!==ui.tab){m.scrollTop=0;m.dataset.tab=ui.tab}
  m.innerHTML=tb+bb+seg+v();
  if(ui.tab==='marks')bindGrid();
}
function needClass(){return `<div class="empty">Create or open a class first.<br><br><button class="btn pri" onclick="go('classes')">Go to Classes</button></div>`}

/* ---------- 1. classes ---------- */
function vClasses(){
  const list=S.classes.map(c=>{const L=level(c.grade);return `<div class="card cls ${c.id===ui.classId?'sel':''}">
    <div class="cls-h"><div class="big">${esc(className(c))}</div><div><b>Grade ${esc(className(c))}</b> · ${esc(c.year)} · Term ${esc(c.term)}<div class="muted small">Teacher: ${esc(c.teacher||'—')}</div></div><span class="badge ${L.key}">${L.name} · AP /${L.max} · Total /${L.max*2}</span></div>
    <div class="muted small">${c.students.length} students · ${c.subjects.length} subjects</div>
    <div class="row"><button class="btn pri sm" onclick="openClass('${c.id}')">Open</button><button class="btn sm" onclick="editClass('${c.id}')">Edit</button><button class="btn sm" onclick="copyClass('${c.id}')">Copy for new term</button><button class="btn sm danger" onclick="delClass('${c.id}')">Delete</button></div></div>`}).join('');
  const e=ui.editClass?S.classes.find(c=>c.id===ui.editClass):null;
  const f=e||{grade:6,section:'',year:new Date().getFullYear(),term:1,teacher:''};
  const gopt=[3,4,5,6,7,8].map(g=>`<option value="${g}" ${Number(f.grade)===g?'selected':''}>Grade ${g} — ${level(g).name} (/${level(g).max})</option>`).join('');
  return `<h1 class="pt">Classes</h1><div class="muted">Lower Primary (Grades 3–5): each assessment period out of 100, total 200. Upper Primary (Grades 6–8): each assessment period out of 200, total 400.</div>
  <div class="grid2"><div>${list||'<div class="empty">No classes yet — fill in the form to create your first class.</div>'}</div>
  <div class="card"><h3>${e?'Edit class':'New class'}</h3>
    <label class="f">Grade<select id="f_grade">${gopt}</select></label>
    <div class="two"><label class="f">Class (e.g. D)<input id="f_section" maxlength="4" value="${esc(f.section)}"></label><label class="f">Year<input id="f_year" type="number" value="${esc(f.year)}"></label></div>
    <label class="f">SAPS file term<select id="f_term">${[1,2,3,4].map(t=>`<option ${Number(f.term)===t?'selected':''}>${t}</option>`).join('')}</select></label>
    <div class="muted small" style="margin:-4px 0 10px">AP1 and AP2 marks for this term are both kept inside the class.</div>
    <label class="f">Class teacher<input id="f_teacher" placeholder="e.g. Mr. Urai" value="${esc(f.teacher)}"></label>
    <div class="row"><button class="btn pri" onclick="saveClass()">${e?'Save changes':'Create class'}</button>${e?'<button class="btn" onclick="ui.editClass=null;render()">Cancel</button>':''}</div>
  </div></div>`;
}
function saveClass(){
  if(!ui.editClass&&S.classes.length>=TRIAL.classes&&needLicence('More than one class'))return;
  const d={grade:Number($('#f_grade').value),section:$('#f_section').value.trim().toUpperCase(),year:$('#f_year').value.trim(),term:$('#f_term').value,teacher:$('#f_teacher').value.trim()};
  if(!d.section){fieldErr('f_section','Enter the class letter, for example D.');return}
  if(ui.editClass){

function editClass(id){ui.editClass=id;render()}

/* ---------- 2. students ---------- */

  <div><div class="card"><h3>Add a student</h3><label class="f">Name (Surname First)<input id="s_name" placeholder="e.g. AISEN Joycelyne" onkeydown="if(event.key==='Enter')addStu()"></label>
    <label class="f">Sex<select id="s_sex"><option>F</option><option>M</option></select></label><button class="btn pri" onclick="addStu()">Add student</button></div>
  <div class="card"><h3>Paste a list</h3><div class="muted small">One student per line. Put the sex after a comma or tab, e.g. <code>ALUNG Arnold, M</code></div>
    <label class="f"><textarea id="s_paste" rows="7"></textarea></label><button class="btn" onclick="pasteStu()">Add these students</button></div></div></div>`;

function setStu(id,k,v){const s=cls().students.find(x=>x.id===id);s[k]=k==='name'?v.trim():v;save()}
function addStu(){const n=$('#s_name').value.trim();if(!n)return;cls().students.push({id:uid(),name:n,sex:$('#s_sex').value});save();render();$('#s_name').focus()}
function delStu(id){const c=cls(),s=c.students.find(x=>x.id===id);if(!confirm(`Remove ${s.name} and their marks?`))return;c.students=c.students.filter(x=>x.id!==id);c.subjects.forEach(sb=>delete sb.scores[id]);save();render()}
function sortStudents(){cls().students.sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));save();render()}
function parseSex(v){const x=String(v||'').trim().toUpperCase();return x.startsWith('M')||x==='BOY'?'M':x.startsWith('F')||x==='GIRL'?'F':''}
function addMany(list){
  const c=cls();const have=new Set(c.students.map(s=>norm(s.name)));let added=0,skipped=0;
  list.forEach(p=>{if(!p.name)return;if(have.has(norm(p.name))){skipped++;return}have.add(norm(p.name));c.students.push({id:uid(),name:p.name,sex:p.sex||'F'});added++});
  save();render();toast(`${added} student(s) added.`+(skipped?` ${skipped} already on the list were skipped.`:''));
}
function pasteStu(){
  const lines=$('#s_paste').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  addMany(lines.map(l=>{const p=l.split(/[,\t]/);const sx=p.length>1?parseSex(p[p.length-1]):'';return {name:(sx?p.slice(0,-1).join(' '):l).replace(/^\d+[.)\s]+/,'').trim(),sex:sx}}));
}
function pickFile(accept,cb){const f=$('#fileIn');f.value='';f.accept=accept;f.onchange=()=>{if(f.files[0])cb(f.files[0])};f.click()}
function readBook(file,cb){const r=new FileReader();r.onload=e=>{try{cb(XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true}))}catch(err){toast('Could not read that file. Save it as an Excel workbook (.xlsx) and try again.\n\n'+err.message)}};r.readAsArrayBuffer(file)}
function findHeader(rows){for(let i=0;i<Math.min(rows.length,30);i++){const j=(rows[i]||[]).findIndex(v=>/^\s*name/i.test(String(v||'')));if(j>=0)return {row:i,nameCol:j}}return null}
function importStudents(){
  pickFile('.xlsx,.xls,.csv',file=>readBook(file,wb=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
    const h=findHeader(rows);let start=0,nc=0,sc=-1;
    if(h){start=h.row+1;nc=h.nameCol;sc=(rows[h.row]||[]).findIndex(v=>/^\s*(sex|gender)/i.test(String(v)))}
    else{nc=rows.some(r=>/^\d+$/.test(String(r[0]).trim())&&r[1])?1:0;sc=nc+1}
    const list=[];for(let i=start;i<rows.length;i++){const r=rows[i]||[];const n=String(r[nc]||'').trim();if(!n||/^\d+(\.\d+)?$/.test(n))continue;list.push({name:n,sex:sc>=0?parseSex(r[sc]):''})}
    if(!list.length){toast('No names found. The sheet needs a column headed "Name".');return}
    addMany(list);
  }));
}
function downloadListTemplate(){
  const c=cls();const ws=XLSX.utils.aoa_to_sheet([['No','Name (Surname First)','Sex'],[1,'SURNAME Firstname','F'],[2,'SURNAME Firstname','M']]);

/* ---------- 3. subjects & tasks ---------- */
function apChips(extra){return `<div class="chips apchips">${APS.map(ap=>`<button class="chip ${ui.ap===ap?'on':''}" onclick="ui.ap=${ap};${extra||''}save();render()"><b>AP${ap}</b><span class="lg"> · Assessment Period ${ap}</span><span class="sh"> · Ass. Period ${ap}</span></button>`).join('')}</div>`}
function vSubjects(){
  const c=cls();if(!c)return needClass();const s=subj();const L=level(c.grade),ap=ui.ap;

    tasks=`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(s.name)} — assessment tasks</h3><div class="row"><button class="btn sm" onclick="renameSubj()">Rename</button><button class="btn sm danger" onclick="delSubj()">Delete subject</button></div></div>
      <label class="f" style="margin-top:10px">Subject teacher (if different from class teacher)<input value="${esc(s.teacher||'')}" onchange="subj().teacher=this.value.trim();save()"></label>
      ${apChips()}
      <div class="meter ${sum>L.max?'over':''}"><i style="width:${Math.min(100,sum/L.max*100)}%"></i></div>${st}
      ${T.length?`<table class="t tasks"><thead><tr><th class="c" style="width:60px">Task No</th><th>Task name</th><th style="width:130px">Ass. type</th><th style="width:150px">Date</th><th class="c" style="width:90px">Out of</th><th style="width:80px"></th></tr></thead><tbody>
      ${T.map((t,i)=>`<tr><td class="c">${i+1}</td><td><input class="cell" value="${esc(t.label)}" onchange="setTask('${t.id}','label',this.value)"></td>
      <td><select onchange="setTask('${t.id}','type',this.value)">${TYPES.map(y=>`<option ${t.type===y?'selected':''}>${y}</option>`).join('')}</select></td>
      <td><input class="cell" type="date" value="${esc(t.date||'')}" onchange="setTask('${t.id}','date',this.value)"></td>
      <td><input class="cell" type="number" min="1" step="0.5" value="${esc(t.max)}" style="text-align:center" onchange="setTask('${t.id}','max',this.value)"></td>
      <td class="c"><button class="btn sm danger" onclick="delTask('${t.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No AP${ap} tasks yet. Add the tests, assignments and projects for Assessment Period ${ap}.</div>`}
      <div class="toolbar"><button class="btn pri" onclick="addTask()">+ Add task</button>${!T.length&&other.length?`<button class="btn" onclick="copyAP()">Copy AP${3-ap} tasks to AP${ap}</button>`:''}${!T.length?`<button class="btn" onclick="splitTasks()">Set up equal tasks…</button>`:''}${c.subjects.length>1&&T.length?`<button class="btn" onclick="copyTasks()">Copy these AP${ap} tasks to other subjects</button>`:''}</div></div>`;
  }
  return `<h1 class="pt">Subjects &amp; Tasks — Grade ${esc(className(c))}</h1><div class="muted">${L.name}: each assessment period is out of <b>${L.max}</b>, so a subject's total (AP1 + AP2) is out of <b>${L.max*2}</b>.</div>
  <div class="card" style="margin-top:14px"><h3>Subjects (${c.subjects.length})</h3><div class="chips">${chips||'<span class="muted">No subjects yet — add one below.</span>'}</div>
  <label for="sub_new" style="display:block;font-weight:600;margin-top:16px">Add a subject</label><div class="row" style="margin-top:6px"><input id="sub_new" class="inp" placeholder="e.g. Making a Living" style="flex:1;min-width:150px" onkeydown="if(event.key==='Enter')addSubj(this.value)"><button class="btn pri" onclick="addSubj($('#sub_new').value)">+ Add subject</button></div>
  ${missing.length?`<div class="muted small" style="margin-top:10px">Quick add:</div><div class="chips">${missing.map(q=>`<button class="chip add" onclick="addSubj(${esc(JSON.stringify(q))})">+ ${esc(q)}</button>`).join('')}</div>`:''}</div>
  ${tasks}`;
}
function addSubj(name){name=String(name||'').trim();if(!name)return;const c=cls();if(c.subjects.length>=TRIAL.subjects&&needLicence(`More than ${TRIAL.subjects} subjects`))return;if(c.subjects.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('That subject is already added.');return}
  const s={id:uid(),name,teacher:'',tasks:[],scores:{}};c.subjects.push(s);ui.subjectId=s.id;ui.tab='subjects';save();render()}
function renameSubj(){const s=subj();const n=prompt('Subject name',s.name);if(n&&n.trim()){s.name=n.trim();save();render()}}
function delSubj(){const c=cls(),s=subj();if(!confirm(`Delete ${s.name} and all its marks (AP1 and AP2)?`))return;c.subjects=c.subjects.filter(x=>x.id!==s.id);fixSubject();save();render()}
function addTask(){const s=subj(),L=level(cls().grade),T=tasksOf(s,ui.ap);const left=Math.max(0,L.max-T.reduce((a,t)=>a+(Number(t.max)||0),0));s.tasks.push({id:uid(),ap:ui.ap,label:'Task '+(T.length+1),type:'Test',date:'',max:left||10});save();render()}
function splitTasks(){const L=level(cls().grade);const n=parseInt(prompt(`How many AP${ui.ap} tasks? The ${L.max} marks will be shared equally.`,'4'),10);if(!(n>0&&n<=20))return;const s=subj();const each=Math.floor(L.max/n*2)/2;
  for(let i=0;i<n;i++)s.tasks.push({id:uid(),ap:ui.ap,label:'Task '+(i+1),type:'Test',date:'',max:i===n-1?r1(L.max-each*(n-1)):each});save();render()}
function copyAP(){const s=subj();tasksOf(s,3-ui.ap).forEach(t=>s.tasks.push({...t,id:uid(),ap:ui.ap,date:''}));save();render()}
function setTask(id,k,v){const s=subj(),t=s.tasks.find(x=>x.id===id);
  if(k==='max'){const n=Number(v);if(!(n>0)){toast('Enter a mark above 0.');render();return}
    const over=Object.values(s.scores).filter(sc=>typeof sc[id]==='number'&&sc[id]>n).length;
    if(over&&!confirm(`${over} student(s) already have more than ${n} for this task. Their marks will be cleared. Continue?`)){render();return}
    Object.values(s.scores).forEach(sc=>{if(typeof sc[id]==='number'&&sc[id]>n)delete sc[id]});t.max=n}
  else t[k]=String(v).trim();save();render()}
function delTask(id){const s=subj();const has=Object.values(s.scores).some(sc=>typeof sc[id]==='number');if(has&&!confirm('This task already has marks. Delete it and its marks?'))return;s.tasks=s.tasks.filter(t=>t.id!==id);Object.values(s.scores).forEach(sc=>delete sc[id]);save();render()}
function copyTasks(){const c=cls(),s=subj(),ap=ui.ap;const others=c.subjects.filter(x=>x.id!==s.id&&!tasksOf(x,ap).length);

/* ---------- 4. marks entry ---------- */
function vMarks(){

  if(!c.students.length)return `<h1 class="pt">Marks Entry</h1><div class="empty">Add students first.<br><br><button class="btn pri" onclick="go('students')">Go to Students</button></div>`;

  return top+`${sum!==L.max?`<div class="note warn">The AP${ap} tasks add up to ${sum}, not ${L.max}. Percentages are still worked out of ${L.max}. <a href="#" onclick="go('subjects');return false">Fix tasks</a></div>`:''}

  <div class="chips">${T.map(t=>`<button class="chip ${ui.mtask===t.id?'on':''}" onclick="ui.mtask='${t.id}';render()">${esc(t.label)} /${esc(t.max)}</button>`).join('')}<button class="chip ${ui.mtask==='all'?'on':''}" onclick="ui.mtask='all';render()">All tasks (table)</button></div>

function taskList(c,s,res){
  const t=s.tasks.find(x=>x.id===ui.mtask);

  <div class="mlist" id="grid">${c.students.map((st,i)=>{const sc=s.scores[st.id]||{},r=res[st.id];return `<div class="mrow" data-sid="${st.id}"><div class="no">${i+1}</div><div class="nm2">${esc(st.name)}<small>${esc(st.sex)}</small></div>
    <input class="sc" inputmode="decimal" enterkeyhint="next" aria-describedby="err-${st.id}" data-s="${st.id}" data-t="${t.id}" data-r="${i}" data-c="0" value="${typeof sc[t.id]==='number'?sc[t.id]:''}" placeholder="–" aria-label="${esc(st.name)} ${esc(t.label)}">
    <div class="rk">AP${ui.ap} <b data-k="tot">${r.tot??'–'}</b><br><span data-k="pos">${r.pos?ord(r.pos):''}</span> <span data-k="grade">${gChip(r.grade)}</span><span data-k="pct" class="hide"></span></div><div class="rowerr hide" id="err-${st.id}" role="alert"></div></div>`}).join('')}</div>`;

function bindGrid(){
  const g=$('#grid');if(!g)return;
  g.addEventListener('input',e=>{if(e.target.classList.contains('sc'))onScore(e.target)});
  g.addEventListener('keydown',e=>{const t=e.target;if(!t.classList.contains('sc'))return;const r=+t.dataset.r,c=+t.dataset.c;let nr=r,nc=c;
    if(e.key==='Enter'||e.key==='ArrowDown')nr=r+(e.shiftKey&&e.key==='Enter'?-1:1);else if(e.key==='ArrowUp')nr=r-1;
    else if(e.key==='ArrowRight'&&t.selectionStart===t.value.length)nc=c+1;else if(e.key==='ArrowLeft'&&t.selectionStart===0)nc=c-1;else return;
    const n=g.querySelector(`input.sc[data-r="${nr}"][data-c="${nc}"]`);if(n){e.preventDefault();n.focus();n.select()}});
  g.addEventListener('focusin',e=>{if(e.target.classList.contains('sc'))e.target.select()});

function onScore(inp){
  const s=subj(),t=s.tasks.find(x=>x.id===inp.dataset.t),sid=inp.dataset.s;const v=inp.value.trim();
  const sc=s.scores[sid]||(s.scores[sid]={});let bad='';
  if(v==='')delete sc[t.id];
  else{const n=Number(v);if(isNaN(n))bad='Marks must be numbers.';else if(n<0)bad='Marks cannot be below 0.';else if(n>Number(t.max))bad=`${t.label} is out of ${t.max} — ${n} is too high.`;else if(Math.round(n*2)!==n*2)bad='Use whole or half marks only (e.g. 12 or 12.5).';
    if(!bad)sc[t.id]=n;else delete sc[t.id];}
  inp.classList.toggle('bad',!!bad);if(bad)inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid');
  const re=document.getElementById('err-'+sid);if(re){re.textContent=bad?`${bad} Not saved.`:'';re.classList.toggle('hide',!bad)}
  const er=$('#gridErr');if(re){er.classList.add('hide')}else er.textContent=bad?`${cls().students.find(x=>x.id===sid).name}: ${bad} This mark is not saved.`:'';if(!re)er.classList.toggle('hide',!bad);
  save();updateCalc();
}
function updateCalc(){
  const c=cls(),s=subj(),res=calc(c,s,ui.ap);
  const dc=$('#doneCount');if(dc&&ui.mtask!=='all')dc.textContent=c.students.filter(st=>typeof (s.scores[st.id]||{})[ui.mtask]==='number').length;
  document.querySelectorAll('#grid [data-sid]').forEach(tr=>{const r=res[tr.dataset.sid];

/* ---------- 5. results ---------- */
function statBlock(list){ // list of {pct,sex}
  const ps=list.filter(x=>x.pct!=null);if(!ps.length)return '<div class="empty">No marks entered yet.</div>';
  const av=a=>a.length?r1(a.reduce((x,y)=>x+y,0)/a.length):'—';
  const all=ps.map(x=>x.pct),m=ps.filter(x=>x.sex==='M').map(x=>x.pct),f=ps.filter(x=>x.sex==='F').map(x=>x.pct);
  const cnt={};bands().forEach(b=>cnt[b.g]=0);ps.forEach(x=>cnt[gradeOf(x.pct)]++);const mx=Math.max(1,...Object.values(cnt));
  return `<div class="stats"><div class="stat"><b>${ps.length}/${list.length}</b><span>students marked</span></div><div class="stat"><b>${av(all)}%</b><span>class average</span></div>
  <div class="stat"><b>${Math.max(...all)}%</b><span>highest</span></div><div class="stat"><b>${Math.min(...all)}%</b><span>lowest</span></div>
  <div class="stat"><b>${av(m)}%</b><span>boys' average</span></div><div class="stat"><b>${av(f)}%</b><span>girls' average</span></div></div>
  <div class="card"><h3>Grade spread</h3><div class="bars">${bands().map(b=>`<div><span>${cnt[b.g]}</span><i class="g${b.g}" style="height:${cnt[b.g]/mx*70}%"></i><b>${b.g}</b></div>`).join('')}</div>
  <div class="muted small">${bands().map(b=>`${b.g}: ${b.min}%+ ${esc(b.label||'')}`).join(' · ')}</div></div>`;
}

  const tb=`<div class="toolbar"><button class="btn pri" onclick="exportSubject()">Export to Excel</button>${view!=='total'?`<button class="btn" onclick="printSAPS(false)">Print AP${view} SAPS sheet</button>`:''}<button class="btn" onclick="printRanking()">Print ranking list</button></div>`;

/* ---------- Excel export / import ---------- */
const A=(r,c)=>XLSX.utils.encode_cell({r,c});
const abs=x=>x.replace(/^([A-Z]+)(\d+)$/,'$$$1$$$2');
const qs=n=>`'${n.replace(/'/g,"''")}'`;
function headerRows(c,title2,ap){
  return [[S.school.name||'SCHOOL NAME'],[[S.school.address,S.school.phone?'PH#: '+S.school.phone:''].filter(Boolean).join('   ')],
    [`SAPS FILE TERM: ${c.term}     ${ap?`ASS. PERIOD #: 0${ap}     `:''}GRADE: ${className(c)}     YEAR: ${c.year}`],[title2]];
}
function gradeFormula(cell){const b=bands();let f=`"${b[b.length-1].g}"`;for(let i=b.length-2;i>=0;i--)f=`IF(${cell}>=${b[i].min},"${b[i].g}",${f})`;return `IF(${cell}="","",${f})`}
function numCell(v,f){return v==null||v===''?{t:'s',v:'',f}:{t:'n',v,f}}
// One AP mark sheet (same layout as the SAPS paper file).
function subjectSheet(c,s,ap){
  const L=level(c.grade),res=calc(c,s,ap),T=tasksOf(s,ap),nt=T.length;
  const aoa=headerRows(c,`SUBJECT: ${s.name.toUpperCase()}     SUBJECT/CLASS-TEACHER: ${(s.teacher||c.teacher||'').toUpperCase()}     AP${ap} — OUT OF ${L.max}`,ap);
  aoa.push(['','Ass. Type','','',...T.map(t=>t.type)]);
  aoa.push(['','Date','','',...T.map(t=>t.date||'')]);
  const H=aoa.length;aoa.push(['No','Name (Surname First)','Sex','Class',...T.map(t=>`${t.label} (${t.max})`),`AP${ap} TOT (${L.max})`,'%','POSITION','GRADE']);
  c.students.forEach((st,i)=>{const sc=s.scores[st.id]||{};aoa.push([i+1,st.name,st.sex,c.section,...T.map(t=>typeof sc[t.id]==='number'?sc[t.id]:'')])});
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const r0=H+1,rN=H+c.students.length,ct=4+nt,cp=ct+1,cq=ct+2,cg=ct+3;
  const totRange=`${abs(A(r0,ct))}:${abs(A(Math.max(r0,rN),ct))}`;
  c.students.forEach((st,i)=>{const r=r0+i,x=res[st.id],rng=`${A(r,4)}:${A(r,3+nt)}`;
    ws[A(r,ct)]=numCell(x.tot,`IF(COUNT(${rng})=0,"",SUM(${rng}))`);
    ws[A(r,cp)]=numCell(x.pct,`IF(${A(r,ct)}="","",ROUND(${A(r,ct)}/${L.max}*100,1))`);
    ws[A(r,cq)]=numCell(x.pos,`IF(${A(r,ct)}="","",RANK(${A(r,ct)},${totRange},0))`);
    ws[A(r,cg)]={t:'s',v:x.grade||'',f:gradeFormula(A(r,cp))};});
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rN,H),c:cg}});
  ws['!cols']=[{wch:5},{wch:28},{wch:5},{wch:6},...T.map(()=>({wch:12})),{wch:11},{wch:7},{wch:9},{wch:7}];
  ws['!merges']=[0,1,2,3].map(r=>({s:{r,c:0},e:{r,c:cg}}));
  return {ws,r0,col:ct};
}
// Subject total sheet: AP1 and AP2 cells link to the AP sheets' TOT column, so edits in Excel flow through.
function finalSheet(c,s,links){
  const L=level(c.grade),t=calcTotal(c,s);
  const aoa=headerRows(c,`SUBJECT: ${s.name.toUpperCase()} — TOTAL (AP1 + AP2)     SUBJECT/CLASS-TEACHER: ${(s.teacher||c.teacher||'').toUpperCase()}`);aoa.push([]);
  const H=aoa.length;aoa.push(['No','Name (Surname First)','Sex',`AP1 (${L.max})`,`AP2 (${L.max})`,`TOTAL (${t.max})`,'%','POSITION','GRADE']);
  c.students.forEach((st,i)=>aoa.push([i+1,st.name,st.sex]));
  const ws=XLSX.utils.aoa_to_sheet(aoa);const r0=H+1,rN=H+c.students.length,rE=Math.max(r0,rN);
  const totRange=`${abs(A(r0,5))}:${abs(A(rE,5))}`;
  const den=`(${L.max}*MAX(1,(COUNT(${abs(A(r0,3))}:${abs(A(rE,3))})>0)+(COUNT(${abs(A(r0,4))}:${abs(A(rE,4))})>0)))`;
  c.students.forEach((st,i)=>{const r=r0+i,x=t.res[st.id];
    APS.forEach((ap,k)=>{const v=x.aps[k],ln=links[ap];ws[A(r,3+k)]=ln?numCell(v,`${qs(ln.sheet)}!${A(ln.r0+i,ln.col)}`):numCell(v)});
    ws[A(r,5)]=numCell(x.tot,`IF(COUNT(${A(r,3)}:${A(r,4)})=0,"",SUM(${A(r,3)}:${A(r,4)}))`);
    ws[A(r,6)]=numCell(x.pct,`IF(${A(r,5)}="","",ROUND(${A(r,5)}/${den}*100,1))`);
    ws[A(r,7)]=numCell(x.pos,`IF(${A(r,5)}="","",RANK(${A(r,5)},${totRange},0))`);
    ws[A(r,8)]={t:'s',v:x.grade||'',f:gradeFormula(A(r,6))};});
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rN,H),c:8}});
  ws['!cols']=[{wch:5},{wch:28},{wch:5},{wch:10},{wch:10},{wch:11},{wch:7},{wch:9},{wch:7}];
  ws['!merges']=[0,1,2,3].map(r=>({s:{r,c:0},e:{r,c:8}}));
  return {ws,r0,col:5};
}
function uniqueName(used,n){const b=safeSheet(n);let x=b,k=2;while(used.has(x.toLowerCase()))x=b.slice(0,28)+' '+k++;used.add(x.toLowerCase());return x}
function sheetBase(s){const n=safeSheet(s.name).trim();if(n.length<=24)return n;const ac=n.split(/[\s&,-]+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).join('');return ac.length>=2?ac:n.slice(0,24).trim()}
function addSubjectSheets(wb,c,s,used){
  const links={};
  APS.forEach(ap=>{if(!tasksOf(s,ap).length)return;const nm=uniqueName(used,`${sheetBase(s)} AP${ap}`);const sh=subjectSheet(c,s,ap);XLSX.utils.book_append_sheet(wb,sh.ws,nm);links[ap]={sheet:nm,r0:sh.r0,col:sh.col}});
  const nm=uniqueName(used,`${sheetBase(s)} Total`);const f=finalSheet(c,s,links);XLSX.utils.book_append_sheet(wb,f.ws,nm);
  return {sheet:nm,r0:f.r0,col:f.col};
}
function rankingSheet(c,s){
  const L=level(c.grade),t=calcTotal(c,s);
  const rows=c.students.map((st,i)=>({st,no:i+1,...t.res[st.id]})).sort(byPos);
  const aoa=headerRows(c,`RANKING — ${s.name.toUpperCase()} — TOTAL AP1 + AP2 (OUT OF ${t.max})`);aoa.push([]);aoa.push(['Position','Name','Sex','No',`AP1 (${L.max})`,`AP2 (${L.max})`,`TOTAL (${t.max})`,'%','Grade']);
  rows.forEach(r=>aoa.push([r.pos||'',r.st.name,r.st.sex,r.no,r.aps[0]??'',r.aps[1]??'',r.tot??'',r.pct??'',r.grade||'']));
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:9},{wch:28},{wch:5},{wch:5},{wch:9},{wch:9},{wch:10},{wch:7},{wch:7}];return ws;
}
// Final results for all subjects; when links are given, each subject column links to that subject's Total sheet.
function summarySheet(c,links){
  const {res,per,grandMax}=calcSummary(c),ns=c.subjects.length;
  const aoa=headerRows(c,`FINAL RESULTS — ALL SUBJECTS (EACH SUBJECT = AP1 + AP2)     CLASS TEACHER: ${(c.teacher||'').toUpperCase()}`);aoa.push([]);const H=aoa.length;
  aoa.push(['No','Name (Surname First)','Sex',...c.subjects.map((s,j)=>`${s.name} (${per[j].max})`),`GRAND TOTAL (${grandMax})`,'%','POSITION','GRADE']);
  c.students.forEach((st,i)=>aoa.push([i+1,st.name,st.sex]));
  const ws=XLSX.utils.aoa_to_sheet(aoa);const r0=H+1,rN=H+c.students.length,ca=3+ns,cp=ca+1,cq=ca+2,cg=ca+3;
  const totRange=`${abs(A(r0,ca))}:${abs(A(Math.max(r0,rN),ca))}`;
  c.students.forEach((st,i)=>{const r=r0+i,x=res[st.id],rng=`${A(r,3)}:${A(r,2+ns)}`;
    x.subs.forEach((sub,j)=>{const ln=links&&links[j];ws[A(r,3+j)]=ln?numCell(sub.tot,`${qs(ln.sheet)}!${A(ln.r0+i,ln.col)}`):numCell(sub.tot)});
    ws[A(r,ca)]=numCell(x.tot,`IF(COUNT(${rng})=0,"",SUM(${rng}))`);
    ws[A(r,cp)]=numCell(x.pct,grandMax?`IF(${A(r,ca)}="","",ROUND(${A(r,ca)}/${grandMax}*100,1))`:undefined);
    ws[A(r,cq)]=numCell(x.pos,`IF(${A(r,ca)}="","",RANK(${A(r,ca)},${totRange},0))`);
    ws[A(r,cg)]={t:'s',v:x.grade||'',f:gradeFormula(A(r,cp))};});
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rN,H),c:cg}});
  ws['!cols']=[{wch:5},{wch:28},{wch:5},...c.subjects.map(()=>({wch:12})),{wch:13},{wch:7},{wch:9},{wch:7}];
  ws['!merges']=[0,1,2,3].map(r=>({s:{r,c:0},e:{r,c:cg}}));return ws;
}
function fileBase(c){return `Grade${className(c)}-T${c.term}-${c.year}`.replace(/[^\w\-]/g,'')}
function exportSubject(){if(needLicence('Excel export'))return;const c=cls(),s=subj();const wb=XLSX.utils.book_new(),used=new Set(['ranking']);
  addSubjectSheets(wb,c,s,used);XLSX.utils.book_append_sheet(wb,rankingSheet(c,s),'Ranking');
  saveBook(wb,`${s.name.replace(/[^\w]+/g,'-')}-${fileBase(c)}.xlsx`)}
function exportSummary(){if(needLicence('Excel export'))return;const c=cls();const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,summarySheet(c,null),'Final Results');saveBook(wb,`Final-Results-${fileBase(c)}.xlsx`)}
function exportAll(){if(needLicence('Excel export'))return;const c=cls();const wb=XLSX.utils.book_new(),used=new Set(['final results']);
  const links=c.subjects.map(s=>addSubjectSheets(wb,c,s,used));
  XLSX.utils.book_append_sheet(wb,summarySheet(c,links),'Final Results');wb.SheetNames.unshift(wb.SheetNames.pop());
  saveBook(wb,`Final-Results-All-Subjects-${fileBase(c)}.xlsx`)}
function importMarks(){
  if(needLicence('Excel import'))return;
  const c=cls(),s=subj(),ap=ui.ap,T=tasksOf(s,ap);
  if(!T.length){toast(`Set up the AP${ap} tasks for ${s.name} first.`);return}
  pickFile('.xlsx,.xls,.csv',file=>readBook(file,wb=>{
    const N=wb.SheetNames,lc=n=>n.toLowerCase(),base=lc(sheetBase(s));
    const name=N.find(n=>lc(n)===`${base} ap${ap}`)||N.find(n=>lc(n)===lc(safeSheet(s.name)))||N.find(n=>lc(n).endsWith(` ap${ap}`))||N.find(n=>!/total|final|ranking|summary/i.test(n))||N[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:true});const h=findHeader(rows);
    if(!h){toast('Could not find the header row (a column headed "Name"). Use a sheet exported from this app.');return}
    const hdr=rows[h.row].map(v=>String(v).trim().toLowerCase());
    const map=T.map(t=>{const full=`${t.label} (${t.max})`.toLowerCase(),lab=t.label.toLowerCase();let j=hdr.indexOf(full);if(j<0)j=hdr.indexOf(lab);if(j<0)j=hdr.findIndex(x=>x.startsWith(lab+' ('));return j});
    if(map.every(j=>j<0)){toast(`None of the ${s.name} AP${ap} task columns were found in sheet "${name}". The column headings must match the task names, e.g. "${T[0].label} (${T[0].max})".`);return}
    const byName={};c.students.forEach(st=>byName[norm(st.name)]=st);
    let got=0,unknown=[],invalid=[];const plan=[];
    for(let i=h.row+1;i<rows.length;i++){const r=rows[i]||[];const nm=String(r[h.nameCol]||'').trim();if(!nm)continue;const st=byName[norm(nm)];if(!st){unknown.push(nm);continue}
      T.forEach((t,k)=>{const j=map[k];if(j<0)return;const v=r[j];if(v===''||v==null)return;const n=Number(v);
        if(isNaN(n)||n<0||n>Number(t.max)||Math.round(n*2)!==n*2){invalid.push(`${nm} – ${t.label}: ${v}`);return}plan.push([st.id,t.id,n])});}
    if(!plan.length){toast('No valid marks found to import.'+(unknown.length?`\n\nNames not on the class list: ${unknown.slice(0,8).join(', ')}`:''));return}
    const missingCols=T.filter((t,k)=>map[k]<0).map(t=>t.label);
    if(!confirm(`Import ${plan.length} mark(s) into ${s.name} AP${ap} from sheet "${name}"?\nMarks already in the app for these students and tasks will be replaced. Blank cells in Excel are left unchanged.`+(missingCols.length?`\n\nColumns not found (skipped): ${missingCols.join(', ')}`:'')))return;
    plan.forEach(([sid,tid,n])=>{(s.scores[sid]||(s.scores[sid]={}))[tid]=n;got++});save();render();
    toast(`${got} mark(s) imported into AP${ap}.`+(unknown.length?`\n\n${unknown.length} name(s) not on the class list were skipped: ${unknown.slice(0,8).join(', ')}${unknown.length>8?'…':''}`:'')+(invalid.length?`\n\n${invalid.length} invalid mark(s) skipped: ${invalid.slice(0,8).join('; ')}${invalid.length>8?'…':''}`:''));
  }));
}

/* ---------- saving files: share sheet on phones, download on PCs ---------- */
const isPhone=()=>window.matchMedia('(pointer:coarse)').matches&&window.innerWidth<=900;
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function saveBlob(blob,name,title){
  if(isPhone()&&navigator.canShare&&window.File){
    try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:title||name});return}}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  downloadBlob(blob,name);setStatus('Saved to Downloads');
}
function saveBook(wb,name){const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name,name.replace(/\.xlsx$/,''))}

/* ---------- printing ---------- */
function printHead(c,extra){return `<div class="hd"><b>${esc(S.school.name||'')}</b><br>${esc(S.school.address||'')}${S.school.phone?'<br>PH#: '+esc(S.school.phone):''}</div>${extra}`}
function doPrint(html){if(trial())html=html.replace(/<div class="ps( land)?">/g,m=>m+'<div class="trialp">TRIAL VERSION — NOT ACTIVATED · SAPS Grade Book</div>');$('#printArea').innerHTML=html;setTimeout(()=>window.print(),50)}
function printSAPS(blank){
  const c=cls(),s=subj(),L=level(c.grade),ap=ui.ap,T=tasksOf(s,ap),res=calc(c,s,ap);
  if(!T.length&&!blank){toast(`No AP${ap} tasks set up for ${s.name} yet.`);return}
  const cols=Math.max(T.length,blank?12:T.length);
  const tk=i=>T[i]||null;const rowsN=Math.max(c.students.length,blank?40:0);
  let h=`<div class="ps">${printHead(c,`<div class="meta"><span>SAPS FILE TERM: <u>${esc(c.term)}</u></span><span>ASS. PERIOD #: <u>0${ap}</u></span><span>GRADE: <u>${esc(className(c))}</u></span><span>OUT OF: <u>${L.max}</u></span></div>
  <div class="meta"><span>SUBJECT: <u>${esc(s.name.toUpperCase())}</u></span><span>SUBJECT/CLASS-TEACHER: <u>${esc((s.teacher||c.teacher||'').toUpperCase())}</u></span></div>`)}
  <table><thead>
  <tr><th rowspan="4" style="width:6mm">No</th><th rowspan="4" style="text-align:left">Name<br>(Surname First)</th><th rowspan="4" style="width:5mm"><span class="vt">SEX</span></th><th rowspan="4" style="width:5mm"><span class="vt">CLASS</span></th><th style="text-align:left;width:14mm">DATE</th>${[...Array(cols)].map((_,i)=>`<th>${tk(i)&&tk(i).date?esc(tk(i).date.slice(5).split('-').reverse().join('/')):''}</th>`).join('')}<th rowspan="4" style="width:9mm">TOT<br>/${L.max}</th><th rowspan="4" style="width:9mm">%</th><th rowspan="4" style="width:6mm"><span class="vt">POSITION</span></th><th rowspan="4" style="width:6mm"><span class="vt">GRADE</span></th></tr>
  <tr><th style="text-align:left">SCORE</th>${[...Array(cols)].map((_,i)=>`<th>${tk(i)?'/'+esc(tk(i).max):''}</th>`).join('')}</tr>
  <tr><th style="text-align:left">Ass.Type</th>${[...Array(cols)].map((_,i)=>`<th>${tk(i)?esc(tk(i).type.slice(0,5)):''}</th>`).join('')}</tr>
  <tr><th style="text-align:left">Task No</th>${[...Array(cols)].map((_,i)=>`<th>${tk(i)?i+1:''}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=0;i<rowsN;i++){const st=c.students[i];const sc=st?(s.scores[st.id]||{}):{},r=st?res[st.id]:{};
    h+=`<tr><td class="c">${i+1}</td><td style="white-space:nowrap">${st?esc(st.name):''}</td><td class="c">${st?esc(st.sex):''}</td><td class="c">${st?esc(c.section):''}</td><td></td>`+
    [...Array(cols)].map((_,j)=>`<td class="c">${!blank&&tk(j)&&typeof sc[tk(j).id]==='number'?sc[tk(j).id]:''}</td>`).join('')+
    `<td class="c">${!blank&&r.tot!=null?r.tot:''}</td><td class="c">${!blank&&r.pct!=null?r.pct:''}</td><td class="c">${!blank&&r.pos?r.pos:''}</td><td class="c">${!blank&&r.grade?r.grade:''}</td></tr>`;}
  h+=`</tbody></table><div class="foot"><span>Teacher's signature: ____________________</span><span>Head Teacher: ____________________</span><span>Date: ____________</span></div></div>`;
  doPrint(h);
}
function printRanking(){
  const c=cls(),s=subj(),L=level(c.grade),view=ui.rview||'total';
  if(view==='total'){
    const t=calcTotal(c,s),rows=c.students.map((st,i)=>({st,...t.res[st.id]})).sort(byPos);
    doPrint(`<div class="ps">${printHead(c,`<div class="meta"><span>RANKING — <u>${esc(s.name.toUpperCase())}</u></span><span>GRADE <u>${esc(className(c))}</u></span><span>TERM <u>${esc(c.term)}</u></span><span>TOTAL AP1 + AP2 OUT OF <u>${t.max}</u></span></div>`)}
    <table><thead><tr><th>Position</th><th style="text-align:left">Name</th><th>Sex</th><th>AP1 /${L.max}</th><th>AP2 /${L.max}</th><th>Total /${t.max}</th><th>%</th><th>Grade</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="c">${r.pos||''}</td><td>${esc(r.st.name)}</td><td class="c">${esc(r.st.sex)}</td><td class="c">${r.aps[0]??''}</td><td class="c">${r.aps[1]??''}</td><td class="c"><b>${r.tot??''}</b></td><td class="c">${r.pct??''}</td><td class="c">${r.grade||''}</td></tr>`).join('')}</tbody></table></div>`);
    return;
  }
  const ap=Number(view),res=calc(c,s,ap),rows=c.students.map((st,i)=>({st,...res[st.id]})).sort(byPos);
  doPrint(`<div class="ps">${printHead(c,`<div class="meta"><span>RANKING — <u>${esc(s.name.toUpperCase())}</u></span><span>GRADE <u>${esc(className(c))}</u></span><span>TERM <u>${esc(c.term)}</u> ASS. PERIOD <u>0${ap}</u></span><span>OUT OF <u>${L.max}</u></span></div>`)}
  <table><thead><tr><th>Position</th><th style="text-align:left">Name</th><th>Sex</th><th>TOT</th><th>%</th><th>Grade</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="c">${r.pos||''}</td><td>${esc(r.st.name)}</td><td class="c">${esc(r.st.sex)}</td><td class="c">${r.tot??''}</td><td class="c">${r.pct??''}</td><td class="c">${r.grade||''}</td></tr>`).join('')}</tbody></table></div>`);
}
function printSummary(){
  const c=cls(),{res,per,grandMax}=calcSummary(c);
  const rows=c.students.map(st=>({st,...res[st.id]})).sort(byPos);
  doPrint(`<div class="ps land">${printHead(c,`<div class="meta"><span>FINAL RESULTS — ALL SUBJECTS (AP1 + AP2)</span><span>GRADE <u>${esc(className(c))}</u></span><span>TERM <u>${esc(c.term)}</u> YEAR <u>${esc(c.year)}</u></span><span>CLASS TEACHER <u>${esc((c.teacher||'').toUpperCase())}</u></span></div>`)}

  <div class="foot"><span>Class teacher: ____________________</span><span>Head Teacher: ____________________</span><span>Date: ____________</span></div></div>`);
}
